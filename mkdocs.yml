site_name: DASC Documentation
site_description: Documentation portal for DASC and PyDASC
site_url: https://pydasc.github.io/
repo_name: pydasc/dasc.github.io
repo_url: https://github.com/pydasc/pydasc.github.io
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  TODO.md
  CODEX_TASK_WEBSITE.md
  CODEX_TASK_READTHEDOCS_STYLE.md
  CODEX_TASKS_DASC_PHYSICS_DOCUMENTATION.md
  browser_control.md
  codex_tasks.md
  architecture/
  exec-plans/
  operations/
  overrides/
  generated-inventory.json

extra_css:
  - stylesheets/readthedocs.css

extra_javascript:
  - javascripts/navigation.js

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  palette:
    scheme: default
    primary: blue
    accent: blue
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Choose a project: getting-started.md
  - PyDASC:
      - Overview: pydasc/index.md
      - Guides:
          - Simulation workflow: pydasc/guides/simulation-workflow.md
      - Reference:
          - Public API policy: pydasc/reference/public-api.md
          - Conventions: pydasc/reference/conventions.md
  - DASC:
      - Project overview: dasc-project-overview.md
      - Physics foundations:
          - Overview: dasc-physics-foundations.md
          - Self-consistent space charge: dasc-self-consistent-space-charge.md
          - Frames, coordinates, units, and conventions: dasc-conventions.md
          - Potentials, fields, and particle dynamics: dasc-potentials-fields-dynamics.md
          - Approximations and validity limits: dasc-validity-limits.md
      - DA, TPSA, and Lie methods:
          - Overview: dasc-differential-algebra-methods.md
          - DA/TPSA objects and coefficients: dasc-da-tpsa.md
          - Differentiating self-consistent calculations: dasc-da-self-consistency.md
          - Lie maps and symplectic structure: dasc-da-lie-maps.md
          - TGF and eigenmode dependency maps: dasc-da-pipelines.md
          - Verification, limits, and scaling: dasc-da-verification.md
      - Truncated Green's-function method:
          - Overview: dasc-tgf-method.md
          - Free-space Poisson problem: dasc-tgf-free-space-poisson.md
          - TGF/VGF formulation: dasc-tgf-formulation.md
          - Fields, particle forces, and kicks: dasc-tgf-field-kick.md
          - Verification and convergence: dasc-tgf-verification.md
      - Causal finite-cavity eigenmode method:
          - Overview: dasc-eigenmode-method.md
          - Geometry, sources, gauge, and boundaries: dasc-eigenmode-problem.md
          - Closed-cavity retarded modal solution: dasc-eigenmode-closed-cavity.md
          - Analytical fields and particle coupling: dasc-eigenmode-fields.md
          - Aperture coupling and downstream pipe: dasc-eigenmode-aperture.md
          - Verification, convergence, and evidence: dasc-eigenmode-verification.md
      - Comparison and method selection: dasc-method-selection.md
      - Physics claim validation matrix: dasc-validation-matrix.md
      - Reproducibility: dasc-reproducibility.md
      - Research outputs and publications:
          - Overview: dasc-research-outputs.md
          - Reviewed source overview: dasc/index.md
  - Contribute: contributing.md
