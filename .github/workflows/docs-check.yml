name: Documentation checks

on:
  pull_request:
    paths:
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/update-source-locks.yml"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "README.md"
      - "docs-manifest.yml"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/update-source-locks.yml"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "README.md"
      - "docs-manifest.yml"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned documentation dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip check

      - name: Check Python formatting
        run: python -m ruff format --check scripts tests

      - name: Run repository tests
        run: python -m pytest

      - name: Validate website manifest without private sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("scripts").resolve()))
          from collect_docs import load_manifest
          load_manifest(Path("docs-manifest.yml"))
          PY

  source-docs:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docs-sources
    steps:
      - name: Check out website repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned documentation dependencies
        run: |
          python -m pip install --requirement requirements-docs.txt
          python -m pip check

      - name: Create read-only token for private documentation sources
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DASC_DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DASC_DOCS_APP_PRIVATE_KEY }}
          owner: pydasc
          repositories: |
            pydasc
            dasc
          permission-contents: read

      - name: Acquire reviewed private source commits
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: >-
          python scripts/acquire_sources.py --manifest docs-manifest.yml
          --output .source-checkouts --mode reviewed

      - name: Validate source contracts
        run: |
          python scripts/collect_docs.py \
            --manifest docs-manifest.yml --output docs \
            --pydasc .source-checkouts/pydasc --dasc .source-checkouts/dasc
          python scripts/validate_docs.py --manifest docs-manifest.yml --docs docs
          python scripts/validate_physics_docs.py --docs docs

      - name: Verify deterministic assembly
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/assembled-docs"
          mkdir -p "$snapshot"
          cp -a docs/pydasc docs/dasc docs/generated-inventory.json "$snapshot/"
          python scripts/collect_docs.py \
            --manifest docs-manifest.yml --output docs \
            --pydasc .source-checkouts/pydasc --dasc .source-checkouts/dasc
          diff --recursive --no-dereference "$snapshot/pydasc" docs/pydasc
          diff --recursive --no-dereference "$snapshot/dasc" docs/dasc
          cmp "$snapshot/generated-inventory.json" docs/generated-inventory.json
          python scripts/validate_docs.py --manifest docs-manifest.yml --docs docs

      - name: Build strict site
        run: mkdocs build --strict

      - name: Validate site links and presentation assets
        run: |
          python scripts/validate_site.py --site site --css docs/stylesheets/readthedocs.css
          python scripts/validate_accessibility.py --site site

      - name: Scan complete site artifact
        shell: bash
        run: python scripts/validate_artifact.py --site site
