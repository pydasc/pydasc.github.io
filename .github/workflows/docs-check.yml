name: Documentation checks

on:
  pull_request:
    paths:
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/update-source-locks.yml"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "README.md"
      - "docs-manifest.yml"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/update-source-locks.yml"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "README.md"
      - "docs-manifest.yml"
      - "mkdocs.yml"
      - "requirements-docs.txt"

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Run repository tests
        run: python -m pytest

      - name: Create read-only token for private documentation sources
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DASC_DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DASC_DOCS_APP_PRIVATE_KEY }}
          owner: pydasc
          repositories: |
            pydasc
            dasc
          permission-contents: read

      - name: Read reviewed source locks
        id: sources
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import sys

          import yaml

          sys.path.insert(0, str(Path("scripts").resolve()))
          from collect_docs import load_manifest

          # Fail before network access if identities, commits, paths, or keys are unsafe.
          load_manifest(Path("docs-manifest.yml"))
          manifest = yaml.safe_load(Path("docs-manifest.yml").read_text(encoding="utf-8"))
          for name in ("pydasc", "dasc"):
              source = manifest["sources"][name]
              print(f"{name}_repository={source['repository']}")
              print(f"{name}_commit={source['checkout_commit']}")
          PY

      - name: Fetch reviewed private source commits
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          PYDASC_REPOSITORY: ${{ steps.sources.outputs.pydasc_repository }}
          PYDASC_COMMIT: ${{ steps.sources.outputs.pydasc_commit }}
          DASC_REPOSITORY: ${{ steps.sources.outputs.dasc_repository }}
          DASC_COMMIT: ${{ steps.sources.outputs.dasc_commit }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 | tr -d '\n')"
          mkdir -p .source-checkouts/pydasc .source-checkouts/dasc
          for name in pydasc dasc; do
            if [[ "$name" == "pydasc" ]]; then
              repository="$PYDASC_REPOSITORY"
              commit="$PYDASC_COMMIT"
            else
              repository="$DASC_REPOSITORY"
              commit="$DASC_COMMIT"
            fi
            git -C ".source-checkouts/$name" init --quiet
            git -C ".source-checkouts/$name" remote add origin "$repository"
            git -C ".source-checkouts/$name" \
              -c credential.helper= -c core.hooksPath=/dev/null \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
              fetch --quiet --no-tags --depth=1 origin "$commit"
            git -C ".source-checkouts/$name" \
              -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
            test "$(git -C ".source-checkouts/$name" rev-parse HEAD)" = "$commit"
            content_commit="$(python - ".source-checkouts/$name/docs/publication-manifest.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("source_commit")
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
              raise SystemExit("publication manifest has an invalid source_commit")
          print(value)
          PY
            )"
            git -C ".source-checkouts/$name" \
              -c credential.helper= -c core.hooksPath=/dev/null \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
              fetch --quiet --no-tags --depth=1 origin "$content_commit"
          done

      - name: Validate source contracts
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python scripts/collect_docs.py \
            --manifest docs-manifest.yml --output docs \
            --pydasc .source-checkouts/pydasc --dasc .source-checkouts/dasc
          python scripts/validate_docs.py --manifest docs-manifest.yml --docs docs
          python scripts/validate_physics_docs.py --docs docs

      - name: Verify deterministic assembly
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/assembled-docs"
          mkdir -p "$snapshot"
          cp -a docs/pydasc docs/dasc docs/generated-inventory.json "$snapshot/"
          python scripts/collect_docs.py \
            --manifest docs-manifest.yml --output docs \
            --pydasc .source-checkouts/pydasc --dasc .source-checkouts/dasc
          diff --recursive --no-dereference "$snapshot/pydasc" docs/pydasc
          diff --recursive --no-dereference "$snapshot/dasc" docs/dasc
          cmp "$snapshot/generated-inventory.json" docs/generated-inventory.json
          python scripts/validate_docs.py --manifest docs-manifest.yml --docs docs

      - name: Build strict site
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: mkdocs build --strict

      - name: Validate site links and presentation assets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python scripts/validate_site.py --site site --css docs/stylesheets/readthedocs.css
          python scripts/validate_accessibility.py --site site

      - name: Scan complete site artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find site -type l -print -quit)"
          test -z "$(find site -type f -size +5M -print -quit)"
          if grep -RIE \
            '(github_pat_|ghp_[[:alnum:]]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|/(Users|home)/[^[:space:]<]+|https?://(localhost|127\.0\.0\.1|[^/[:space:]]+\.internal))' \
            site; then
            echo "Forbidden credential-like or private/local content in site artifact" >&2
            exit 1
          fi
