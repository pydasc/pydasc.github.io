name: Propose documentation source updates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-lock-updates
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out website repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Create read-only token for private documentation sources
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DASC_DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DASC_DOCS_APP_PRIVATE_KEY }}
          owner: pydasc
          repositories: |
            pydasc
            dasc
          permission-contents: read

      - name: Stop when an update proposal is already open
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --state open --json headRefName \
            --jq 'map(select(.headRefName | startswith("automation/source-locks-"))) | length')"
          if [[ "$count" -gt 0 ]]; then
            echo "An automated source-lock pull request is already open."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch candidate private source heads
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 | tr -d '\n')"
          mkdir -p .source-checkouts
          git -c credential.helper= -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            clone --quiet --depth=1 \
            https://github.com/pydasc/pydasc .source-checkouts/pydasc
          git -c credential.helper= -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            clone --quiet --depth=1 \
            https://github.com/pydasc/dasc .source-checkouts/dasc
          for name in pydasc dasc; do
            content_commit="$(python - ".source-checkouts/$name/docs/publication-manifest.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("source_commit")
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
              raise SystemExit("candidate publication manifest has an invalid source_commit")
          print(value)
          PY
            )"
            git -C ".source-checkouts/$name" -c credential.helper= \
              -c core.hooksPath=/dev/null \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
              fetch --quiet --no-tags --depth=1 origin "$content_commit"
          done

      - name: Validate candidates and update locks
        if: steps.existing.outputs.skip != 'true'
        run: |
          python scripts/update_source_locks.py \
            --skip-unapproved \
            --manifest docs-manifest.yml \
            --pydasc .source-checkouts/pydasc \
            --dasc .source-checkouts/dasc

      - name: Detect lock changes
        if: steps.existing.outputs.skip != 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- docs-manifest.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate complete proposed release
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest
          python scripts/collect_docs.py \
            --manifest docs-manifest.yml --output docs \
            --pydasc .source-checkouts/pydasc --dasc .source-checkouts/dasc
          python scripts/validate_docs.py --manifest docs-manifest.yml --docs docs
          python scripts/validate_physics_docs.py --docs docs
          snapshot="$RUNNER_TEMP/assembled-docs"
          mkdir -p "$snapshot"
          cp -a docs/pydasc docs/dasc docs/generated-inventory.json "$snapshot/"
          python scripts/collect_docs.py \
            --manifest docs-manifest.yml --output docs \
            --pydasc .source-checkouts/pydasc --dasc .source-checkouts/dasc
          diff --recursive --no-dereference "$snapshot/pydasc" docs/pydasc
          diff --recursive --no-dereference "$snapshot/dasc" docs/dasc
          cmp "$snapshot/generated-inventory.json" docs/generated-inventory.json
          mkdocs build --strict
          python scripts/validate_site.py --site site --css docs/stylesheets/readthedocs.css
          python scripts/validate_accessibility.py --site site

      - name: Scan proposed site artifact
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find site -type l -print -quit)"
          test -z "$(find site -type f -size +5M -print -quit)"
          if grep -RIE \
            '(github_pat_|ghp_[[:alnum:]]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|/(Users|home)/[^[:space:]<]+|https?://(localhost|127\.0\.0\.1|[^/[:space:]]+\.internal))' \
            site; then
            echo "Forbidden credential-like or private/local content in site artifact" >&2
            exit 1
          fi

      - name: Create source-lock pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/source-locks-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add docs-manifest.yml
          git commit -m "chore: update documentation source locks"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update documentation source locks" \
            --body "Automated proposal from the reviewed upstream publication contracts. The workflow validated the candidate contracts, assembled twice, ran tests, built strictly, checked accessibility and links, and scanned the complete site artifact. Review this manifest change as a public content release; merging is never automatic."
