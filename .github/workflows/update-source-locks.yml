name: Propose documentation source updates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-lock-updates
  cancel-in-progress: false

jobs:
  propose:
    permissions:
      contents: write
      pull-requests: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment: docs-sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out website repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned documentation dependencies
        run: |
          python -m pip install --requirement requirements-docs.txt
          python -m pip check

      - name: Create read-only token for private documentation sources
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DASC_DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DASC_DOCS_APP_PRIVATE_KEY }}
          owner: pydasc
          repositories: |
            pydasc
            dasc
          permission-contents: read

      - name: Stop when an update proposal is already open
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --state open --json headRefName \
            --jq 'map(select(.headRefName | startswith("automation/source-locks-"))) | length')"
          if [[ "$count" -gt 0 ]]; then
            echo "An automated source-lock pull request is already open."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Acquire candidate private source commits
        if: steps.existing.outputs.skip != 'true'
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: >-
          python scripts/acquire_sources.py --manifest docs-manifest.yml
          --output .source-checkouts --mode candidate

      - name: Validate candidates and update locks
        if: steps.existing.outputs.skip != 'true'
        run: |
          python scripts/update_source_locks.py \
            --skip-unapproved \
            --manifest docs-manifest.yml \
            --pydasc .source-checkouts/pydasc \
            --dasc .source-checkouts/dasc

      - name: Detect lock changes
        if: steps.existing.outputs.skip != 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- docs-manifest.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up browser-check runtime
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install pinned browser checks
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: Check complete release
        if: steps.changes.outputs.changed == 'true'
        run: >-
          python scripts/check_release.py --pydasc .source-checkouts/pydasc
          --dasc .source-checkouts/dasc --browser-tests

      - name: Create source-lock pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/source-locks-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add docs-manifest.yml
          git commit -m "chore: update documentation source locks"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update documentation source locks" \
            --body "Automated proposal from the reviewed upstream publication contracts. The workflow validated the candidate contracts, assembled twice, ran tests, built strictly, checked accessibility and links, and scanned the complete site artifact. Review this manifest change as a public content release; merging is never automatic."
